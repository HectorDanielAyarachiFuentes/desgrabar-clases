<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desgrabador Deepgram</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 100%;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .header {
      border-bottom: 1px solid #1e293b;
      padding-bottom: 10px;
    }
    h3 {
      color: #38bdf8;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .app-header-icon {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      object-fit: cover;
      box-shadow: 0 2px 8px rgba(56, 189, 248, 0.25);
    }
    .subtitle {
      font-size: 0.78rem;
      color: #94a3b8;
      margin-top: 4px;
    }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 0.82rem;
      font-weight: 600;
      color: #cbd5e1;
    }
    input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f8fafc;
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #38bdf8;
    }
    .file-input-wrapper {
      position: relative;
      width: 100%;
    }
    input[type="file"] {
      width: 100%;
      padding: 8px;
      background: #1e293b;
      border: 1px dashed #475569;
      border-radius: 6px;
      color: #94a3b8;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    input[type="file"]:hover {
      border-color: #38bdf8;
      background: #1e293b;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    button:hover:not(:disabled) {
      background: #0369a1;
    }
    button:active:not(:disabled) {
      transform: scale(0.99);
    }
    button:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
    }

    /* Progress bar and timer styles */
    .progress-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #1e293b;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid #334155;
      transition: opacity 0.3s;
    }
    .progress-container.hidden {
      display: none;
    }
    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      font-weight: 600;
    }
    #progressStatus {
      color: #38bdf8;
    }
    #timerDisplay {
      color: #f59e0b;
      font-family: monospace;
      font-size: 0.85rem;
    }
    .progress-bar-track {
      width: 100%;
      height: 8px;
      background: #0f172a;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #0284c7);
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    .progress-bar-fill.indeterminate {
      width: 40%;
      position: absolute;
      animation: pulseMove 1.5s infinite ease-in-out;
    }
    .progress-bar-fill.success {
      width: 100% !important;
      background: #4ade80 !important;
      position: static;
    }
    .progress-bar-fill.error {
      width: 100% !important;
      background: #f87171 !important;
      position: static;
    }

    @keyframes pulseMove {
      0% { left: 0%; width: 20%; }
      50% { left: 50%; width: 40%; }
      100% { left: 80%; width: 20%; }
    }

    .status-container {
      min-height: 20px;
      display: flex;
      align-items: center;
    }
    #status {
      font-size: 0.82rem;
      font-weight: 500;
      color: #38bdf8;
    }
    #status.error {
      color: #f87171;
    }
    #status.success {
      color: #4ade80;
    }

    textarea {
      width: 100%;
      height: 200px;
      padding: 10px 12px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f8fafc;
      font-size: 0.85rem;
      font-family: inherit;
      resize: vertical;
      outline: none;
      line-height: 1.6;
      white-space: pre-wrap;
    }
    textarea:focus {
      border-color: #38bdf8;
    }

    .actions-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .download-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .btn-secondary {
      background: #334155;
      color: #f1f5f9;
    }
    .btn-secondary:hover:not(:disabled) {
      background: #475569;
    }
    .btn-export {
      font-size: 0.84rem;
      padding: 9px;
    }
    .btn-pdf {
      background: #be123c;
    }
    .btn-pdf:hover:not(:disabled) {
      background: #9f1239;
    }
    .btn-word {
      background: #1d4ed8;
    }
    .btn-word:hover:not(:disabled) {
      background: #1e40af;
    }
  </style>
</head>
<body>
  <div class="header">
    <h3>
      <img src="icon.png" alt="Icono" class="app-header-icon">
      Desgrabador Deepgram
    </h3>
    <div class="subtitle">Panel lateral Firefox</div>
  </div>

  <div class="field-group">
    <label for="apiKey">Deepgram API Key:</label>
    <input id="apiKey" type="text" placeholder="Ingresa tu API key de Deepgram">
  </div>

  <div class="field-group">
    <label for="audioFile">Archivo de Audio o Video:</label>
    <div class="file-input-wrapper">
      <input id="audioFile" type="file" accept="audio/*,video/*,.mp3,.mp4,.wav,.m4a,.webm,.mkv,.flac,.ogg,.aac,.mov,.avi">
    </div>
  </div>

  <div class="field-group">
    <label for="docTitle">Título del Documento:</label>
    <input id="docTitle" type="text" placeholder="Ej: Clase 1 - Historia Argentina" value="Transcripción de Audio / Video">
  </div>

  <button id="btnTranscribe">Transcribir Archivo</button>

  <!-- Progress Bar and Timer Section -->
  <div id="progressContainer" class="progress-container hidden">
    <div class="progress-header">
      <span id="progressStatus">Procesando...</span>
      <span id="timerDisplay">⏱️ 00:00</span>
    </div>
    <div class="progress-bar-track">
      <div id="progressBarFill" class="progress-bar-fill"></div>
    </div>
  </div>

  <div class="status-container">
    <div id="status"></div>
  </div>

  <div class="field-group">
    <label for="resultText">Transcripción Formateada:</label>
    <textarea id="resultText" placeholder="La transcripción aparecerá aquí dividida en párrafos legibles..."></textarea>
  </div>

  <div class="actions-group">
    <button id="btnCopy" class="btn-secondary">📋 Copiar Texto</button>
    <div class="download-row">
      <button id="btnPdf" class="btn-export btn-pdf">📄 Exportar PDF</button>
      <button id="btnWord" class="btn-export btn-word">📝 Exportar Word</button>
    </div>
  </div>

  <script src="lib/jspdf.umd.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
